# GraphChecker HDFS processing configuration.
# This file is sourced by the helper scripts for paths only.

hdfs_dir=/opt/hadoop/hadoop-hdfs-project/hadoop-hdfs
system_dir_path=/opt/hadoop
system_version_suffix=3.0.0-alpha4-SNAPSHOT
causynth_repo=/opt/hadoop
causynth_module_dir=/opt/hadoop/hadoop-hdfs-project/hadoop-hdfs
causynth_expected_hadoop_commit=ece33208b89a6a06c1b362d10fab31343fe5df13
causynth_hadoop_experiment_patch=UPSTREAM_PRE_HDFS_11741
causynth_hadoop_pinned_source=hadoop-hdfs-project/hadoop-hdfs/src/main/java/org/apache/hadoop/hdfs/security/token/block/BlockTokenSecretManager.java
causynth_hadoop_pinned_source_sha256=be9ce1a57980fdab5612abed1886362842099e1df657b0cdb8c95dbb0a480093
causynth_hdfs_11741_fix_commit=6a3fc685a98718742c351ed6625dc7a4dee55e77
causynth_output_dir=/opt/GraphChecker/causynth-output/hdfs-11741-pre-fix-ece33208-auto-smt-v4
causynth_target_spec=/opt/GraphChecker/targets/hdfs/target.yaml
causynth_analysis_scope=hdfs_block_key
causynth_extra_process_dirs=/opt/hadoop/hadoop-hdfs-project/hadoop-hdfs-client/target/classes
causynth_run_unit_tests=false
causynth_test_limit=3
causynth_workload_test=org.apache.hadoop.hdfs.server.balancer.TestBalancerWithEncryptedTransfer#testEncryptedBalancer1
causynth_coverage_strict=false
causynth_static_max_methods=2500
causynth_static_max_edges=150000
# A fresh static process is useful only if the two block-key maintenance
# chains retain their real thread roots.  Required methods are separated by
# "|" so complete JVM signatures (which may contain commas) remain intact.
causynth_hdfs_region_root_gate_enabled=true
causynth_hdfs_region_root_gate_file=symbolic_regions.jsonl
causynth_hdfs_dn_region_root_method='<org.apache.hadoop.hdfs.server.datanode.BPServiceActor: void run()>'
causynth_hdfs_dn_region_required_methods='<org.apache.hadoop.hdfs.security.token.block.BlockTokenSecretManager: void addKeys(org.apache.hadoop.hdfs.security.token.block.ExportedBlockKeys)>|<org.apache.hadoop.hdfs.security.token.block.BlockTokenSecretManager: void removeExpiredKeys()>'
causynth_hdfs_nn_region_root_method='<org.apache.hadoop.hdfs.server.blockmanagement.HeartbeatManager$Monitor: void run()>'
causynth_hdfs_nn_region_required_methods='<org.apache.hadoop.hdfs.security.token.block.BlockTokenSecretManager: void removeExpiredKeys()>'
# The full BPServiceActor lifetime is intentionally the region root, but its
# outer service loop is not part of the bounded HDFS-11741 model.  A completed
# runtime aggregation may therefore retain a bounded path-signature prefix for
# this exact configured root.  Call-tree, graph, trace, and catalog truncation
# remain forbidden; the approximation is recorded in runtime provenance.
causynth_hdfs_allow_outer_loop_path_signature_truncation=true
causynth_hdfs_outer_loop_path_truncation_roots='<org.apache.hadoop.hdfs.server.datanode.BPServiceActor: void run()>'
causynth_trace_max_events=2000000
causynth_trace_max_graph_edges=2000000
causynth_trace_max_context_pairs_per_edge=2000
causynth_campaign_trace_max_events=2000000
causynth_campaign_trace_max_graph_edges=2000000
causynth_campaign_trace_max_context_pairs_per_edge=2000
# Activation-specific instrumentation and custom-JDK workloads are independent.
# The batch runner snapshots this base target per job before launching replays,
# so Maven/Surefire and MiniDFSCluster never share writable state.
causynth_hdfs_concolic_parallelism=2
causynth_hdfs_concolic_base_target=/opt/hadoop/hadoop-hdfs-project/hadoop-hdfs/target
causynth_hdfs_concolic_batch_status_subdir=concolic-batch-status
causynth_hdfs_target_snapshot_mode=auto
# Activation-specific class generation reuses this immutable, hash-bound
# static catalog instead of rebuilding the 150k-edge graph for every worker.
# Trace+concolic campaign discovery still runs the complete static pipeline.
causynth_hdfs_concolic_static_reuse_enabled=true
causynth_hdfs_concolic_static_reuse_manifest_file=concolic_static_reuse_manifest.json
causynth_hdfs_concolic_static_reuse_manifest_class=edu.uva.liftlab.graphchecker.causynth.ConcolicStaticCatalogManifest
causynth_hdfs_concolic_tree_digest_class=edu.uva.liftlab.graphchecker.causynth.ConcolicClassTreeDigest
causynth_hdfs_concolic_static_reuse_regions_file=symbolic_regions.jsonl
causynth_hdfs_concolic_static_reuse_coverage_file=symbolic_coverage.json
causynth_hdfs_concolic_static_reuse_graph_file=static_dataflow_edges.jsonl
causynth_hdfs_concolic_static_reuse_region_edges_file=symbolic_region_edges.jsonl
causynth_hdfs_concolic_static_reuse_static_provenance_file=static_process_provenance.json
causynth_hdfs_concolic_static_reuse_report_file=concolic_instrumentation_report.json
causynth_hdfs_concolic_process_provenance_file=concolic_process_provenance.json
# auto requires the provenance gate for an exact, reuse-enabled replay.  Set
# false only for an explicitly full-static/legacy replay class tree.
causynth_hdfs_concolic_process_provenance_required=auto
# Destructive class-tree replacement is allowed only for the exact checked-in
# concolic_classes_path or strict descendants of these replay-owned roots.
causynth_hdfs_concolic_classes_allowed_roots=/opt/GraphChecker/target/hdfs-concolic-replay-classes

# Executables are configuration, not host assumptions.  protoc 2.5 matches
# this pinned Hadoop revision's generated-code runtime.
graphchecker_java_bin=/usr/bin/java
hadoop_maven_bin=/usr/bin/mvn
container_runtime_bin=/usr/bin/docker
container_runtime_group=docker
z3_bin=/usr/local/bin/z3
protoc_bin=/opt/GraphChecker/target/tools/protobuf-2.5/bin/protoc
snapshot_copy_bin=/usr/bin/cp
java_archive_bin=/usr/bin/jar
# The HDFS-11741 adapter uses semantic selectors from this policy; generated
# region/activation ids and artifact locations are discovered at runtime.
causynth_hdfs_bootstrap_policy=/opt/GraphChecker/experiments/hdfs/conf/hdfs-11741-bootstrap-policy.json
causynth_hdfs_bootstrap_output_subdir=hdfs-11741-bootstrap
causynth_hdfs_bootstrap_composer_class=edu.uva.liftlab.graphchecker.causynth.Hdfs11741BootstrapComposer
causynth_hdfs_bootstrap_smt_file=hdfs_11741_bootstrap.smt2
causynth_hdfs_bootstrap_manifest_file=hdfs_11741_bootstrap_manifest.json
causynth_hdfs_bootstrap_composer_stdout_file=hdfs_11741_composer.out
causynth_hdfs_bootstrap_solver_output_file=hdfs_11741_z3.out
causynth_hdfs_bootstrap_solver_stderr_file=hdfs_11741_z3.err
causynth_hdfs_bootstrap_solver_manifest_file=hdfs_11741_z3_manifest.json
causynth_hdfs_bootstrap_replay_summaries=
causynth_hdfs_bootstrap_regions_file=symbolic_regions.jsonl
causynth_hdfs_bootstrap_static_graph_file=static_dataflow_edges.jsonl
causynth_hdfs_bootstrap_region_edges_file=symbolic_region_edges.jsonl
causynth_hdfs_bootstrap_runtime_edges_file=runtime_region_edge_validation.jsonl
causynth_hdfs_bootstrap_runtime_summary_file=runtime_region_summary.json
causynth_hdfs_bootstrap_activation_plan_file=concolic_activation_plan.jsonl
causynth_hdfs_bootstrap_offline_provenance_file=offline_aggregation_provenance.json
# The HDFS trace can instantiate close to two million context edges.  Edge
# JSON is streamed, while the bounded accumulator maps remain resident.
causynth_trace_offline_aggregation_heap=24g
causynth_campaign_offline_aggregation_heap=24g

system_classes_path=/opt/GraphChecker/experiments/hdfs/original_classes
instrumented_classes_path=/opt/GraphChecker/experiments/hdfs/instrumented_classes.hdfs-11741-auto-smt-v4
concolic_classes_path=/opt/GraphChecker/experiments/hdfs/concolic_classes.hdfs-11741-auto-smt-v4
concolic_openjdk_dir=/opt/GraphChecker/third_party/OpenJDK-Concolic-Execution-Engine
concolic_docker_image=causynth-openjdk8-build:ubuntu18
concolic_maven_dir=/usr/share/maven
concolic_maven_java_lib_dir=/usr/share/java
concolic_maven_etc_dir=/etc/maven
concolic_maven_command=mvn

java_class_path="\
${system_dir_path}/hadoop-hdfs-project/hadoop-hdfs/target/hadoop-hdfs-${system_version_suffix}.jar:\
${system_dir_path}/hadoop-common-project/hadoop-common/target/hadoop-common-${system_version_suffix}.jar:\
${system_dir_path}/hadoop-common-project/hadoop-common/target/hadoop-common-${system_version_suffix}/share/hadoop/common/lib/*:\
${system_dir_path}/hadoop-common-project/hadoop-kms/target/hadoop-kms-${system_version_suffix}/share/hadoop/common/lib/*:\
${system_dir_path}/hadoop-hdfs-project/hadoop-hdfs/target/hadoop-hdfs-${system_version_suffix}/share/hadoop/hdfs/lib/*:\
${system_dir_path}/hadoop-hdfs-project/hadoop-hdfs-client/target/hadoop-hdfs-client-${system_version_suffix}.jar:\
${system_dir_path}/hadoop-hdfs-project/hadoop-hdfs-client/target/hadoop-hdfs-client-${system_version_suffix}/share/hadoop/hdfs/lib/*"
