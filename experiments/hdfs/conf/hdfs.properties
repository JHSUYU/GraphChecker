# =============================================================================
# GraphChecker configuration for Apache Hadoop HDFS 3.3.4
#
# This file is both:
#   - sourced by run_engine.sh (bash) for infrastructure variables
#   - loaded by GraphCheckerTransformer (Java Properties) for analysis config
#
# Usage:
#   ./run_engine.sh build
#   ./run_engine.sh transform experiments/hdfs/conf/hdfs.properties
# =============================================================================

# -----------------------------------------------------------------------------
# Infrastructure paths (bash variables used by run_hdfs.sh)
# -----------------------------------------------------------------------------

# Real HDFS project root (for compile / surefire:test)
hdfs_dir=/Users/lizhenyu/IdeaProjects/hadoop/hadoop-hdfs-project/hadoop-hdfs

# Hadoop source root — used in java_class_path to reference built distribution
# directories and local Maven repo relative to this location.
system_dir_path=/Users/lizhenyu/IdeaProjects/hadoop

# Hadoop version string used in built distribution directory names
system_version_suffix=3.3.4

# Dedicated snapshot of original compiled HDFS classes — GraphChecker input.
system_classes_path=/Users/lizhenyu/IdeaProjects/GraphChecker/experiments/hdfs/original_classes

# Dedicated output directory for GraphChecker instrumented classes
instrumented_classes_path=/Users/lizhenyu/IdeaProjects/GraphChecker/experiments/hdfs/instrumented_classes

# Full JVM classpath (resolved from Hadoop build output directories)
# Module jars live in target/, third-party deps in share/.../lib/.
# Only include directories that actually exist after per-module builds.
java_class_path="\
${system_dir_path}/hadoop-common-project/hadoop-common/target/hadoop-common-${system_version_suffix}.jar:\
${system_dir_path}/hadoop-common-project/hadoop-common/target/hadoop-common-${system_version_suffix}/share/hadoop/common/lib/*:\
${system_dir_path}/hadoop-common-project/hadoop-kms/target/hadoop-kms-${system_version_suffix}/share/hadoop/common/lib/*:\
${system_dir_path}/hadoop-hdfs-project/hadoop-hdfs/target/hadoop-hdfs-${system_version_suffix}.jar:\
${system_dir_path}/hadoop-hdfs-project/hadoop-hdfs/target/hadoop-hdfs-${system_version_suffix}/share/hadoop/hdfs/lib/*:\
${system_dir_path}/hadoop-hdfs-project/hadoop-hdfs-client/target/hadoop-hdfs-client-${system_version_suffix}.jar:\
${system_dir_path}/hadoop-hdfs-project/hadoop-hdfs-client/target/hadoop-hdfs-client-${system_version_suffix}/share/hadoop/hdfs/lib/*"

# Runtime lib path (for reference)
runtime_lib_path=${system_dir_path}/hadoop-dist/target/hadoop-${system_version_suffix}/

# =============================================================================
# GraphChecker analysis configuration (Java Properties keys)
# =============================================================================

# Classes to instrument (whitelist by package prefix); empty = instrument all
# non-JDK application classes found in system_classes_path
whitelist_pilotfunc_classes=org.apache.hadoop.hdfs

# Classes to exclude from instrumentation (blacklist by name fragment)
blacklist_pilotfunc_classes=org.apache.hadoop.hdfs.protocolPB,org.apache.hadoop.hdfs.protocol.proto

# State isolation black/white lists (leave empty to disable state redirection)
blacklist_state_classes=
whitelist_state_classes=

# HTTP context propagation target classes
http_send_classes=
http_recv_classes=

# RPC classes for context propagation
rpc_classes=

# I/O-intensive classes for IO isolation
io_classes=

# SEDA queue/worker mappings (format: queueClass:workerClass, comma-separated)
seda_queue=
seda_worker=

# Entry point classes for recovery analysis
entry_classes=org.apache.hadoop.hdfs.server.namenode.NameNode

# Starting point methods (format: className#methodName, comma-separated)
startpoint_methods=org.apache.hadoop.hdfs.server.namenode.NameNode#main

# Starting point file — lists interfaces whose implementations are trace entry points.
# Also instruments run() in Runnable and call() in Callable implementations.
starting_point_file=experiments/hdfs/startingpoint.txt

# Classes for context tracking initialisation
pilottrack_init_class=

# Context tree blacklist (classes excluded from context propagation)
ctxTreeBlacklist_classes=

# Classes that require manual instrumentation handling
manual_ignore_classes=

# Trace classes
trace_classes=

# Isolate classes (full state isolation)
isolate_classes=

# Enable OpenTelemetry context propagation at async boundaries
context_propagation_enabled=true

# Use simplified (single-pass) instrumentation mode
simple_instrumentation=