# HDFS-11741's inputs to the production run_engine.sh campaign.
#
# This is the analysis/planning half of the experiment. The workload half is
# source-first-launcher.sh, which this file names as workload_command and
# invokes once per pass; run_engine.sh owns the pass ordering
# (analyze -> workload -> skeleton recorder -> re-analyze -> workload ->
# recorder -> schedule) and this file owns nothing but the paths.
#
# Two values are deliberately absent and must be supplied by the caller:
#   CAUSYNTH_CLASSPATH  the Hadoop test-scope classpath the launcher's build
#                       command wrote (hadoop-test-classpath.txt), prefixed by
#                       the module class outputs. It is a build product, not a
#                       constant, so it is not pinned here.
#   GRAPH_CHECKER_JAVA  a java wrapper carrying the analysis heap.
#
# The output root is an absolute path outside the repository because one traced
# pass writes several GB and the root filesystem is the small one here. It is
# named once, as causynth_output_dir: the instrumented classes, the runtime
# region plan and the campaign root all derive from it (run_engine.sh's
# initialize_config), so a new generation changes one line and cannot half
# resume an old one. Every derived path is therefore absent on purpose -- do
# not re-add analysis_classes_dir, runtime_region_plan or schedule_output_dir.
#
# The campaign root is <causynth_output_dir>/schedule; that is where
# iteration-NNNN/ and final/ land.

workflow_path_base=project

# GraphChecker toolchain.
graphchecker_jar=target/GraphChecker-1.0-SNAPSHOT-jar-with-dependencies.jar
graphchecker_work_dir=.
java_bin=java

# The Hadoop checkout is the source of truth; the launcher's build command
# compiles it and these are the outputs it leaves behind. CAUSYNTH_REPO
# overrides it. /opt/hadoop is a different, stale checkout carrying none of the
# Causynth commits, and it is not this workload.
project_repo=/users/ZhenyuLi/dev/hadoop
project_module_dir=@repo/hadoop-hdfs-project/hadoop-hdfs
project_classes_dir=@repo/hadoop-hdfs-project/hadoop-hdfs/target/classes
project_test_classes_dir=@repo/hadoop-hdfs-project/hadoop-hdfs/target/test-classes

# One fresh generation root. campaign-run69..run80 are published and must not
# be resumed; run81 was configured but never produced, so its name carries the
# old plan's confusion with it. Change this line -- and only this line -- for
# the next generation.
causynth_output_dir=/proj/silentfailure-PG0/gc-hdfs-11741/campaign-takeover-40
# target.yaml is what the launcher's own TargetSpecFile writes, so the analysis
# and the run name the same target. @config resolves beside this file, which is
# what keeps a moved or copied checkout from silently reading another tree's
# target.
causynth_target_spec=@config/target.yaml
causynth_analysis_scope=hdfs-11741
causynth_process_dirs=@repo/hadoop-hdfs-project/hadoop-hdfs/target/classes:@repo/hadoop-hdfs-project/hadoop-hdfs-client/target/classes:@repo/hadoop-common-project/hadoop-common/target/classes

# The chain's protocol endpoints. Hadoop delivers an IPC call through
# ProtobufRpcEngine's reflective dispatch, so no static caller edge reaches the
# server implementation and no region would be planned on it; the SASL
# handshake has no Java call pair at all. These declarations are what names the
# two ends of each exchange, and they belong to the static analysis, not to a
# retired pipeline: SeedBackwardStaticAnalyzer resolves them into protocol
# anchors and transport boundaries. They declare endpoints only; the values
# crossing a boundary are carried by recorded expression handoff.
causynth_protocol_stubs=experiments/hdfs/hdfs-11741/protocol-stubs.jsonl

# README section "Loops": every retained condition-controlled loop of this
# workload's failure-relevant chain declares its own K_L here, so no loop
# inherits the core default. The file is experiment-owned on purpose -- the
# bounds are a statement about this workload, and the analyzer must stay free
# of HDFS numbers. run_engine.sh dies if the file is missing rather than
# falling back, because a campaign whose declarations never arrived would
# quietly model an 8-body prefix.
causynth_loop_bounds=experiments/hdfs/hdfs-11741/loop-bounds.jsonl
causynth_symbolic_inputs=experiments/hdfs/hdfs-11741/symbolic-inputs.jsonl

# Runtime. The tracing passes run on a stock JVM: they need the rewritten
# classes, not symbolic execution, and the concolic image only makes them
# slower. The concolic image is named here because the later replay stage
# reads it from the same configuration.
custom_jdk_home=third_party/OpenJDK-Concolic-Execution-Engine/build/linux-x86_64-normal-zero-release/images/j2sdk-image
z3_bin=z3
workload_work_dir=@project/.
workload_command=experiments/hdfs/hdfs-11741/pass.sh
trace_test=org.apache.hadoop.hdfs.server.balancer.TestBalancerWithEncryptedTransfer#testEncryptedBalancer1

# Scheduler and solver bounds. The runtime region plan and the campaign root
# are derived from causynth_output_dir above; the engine refuses to overwrite a
# published iteration or final result, so a fresh root is the whole ceremony.
schedule_max_jobs=128
solver_timeout_ms=600000
reach_max_inputs=12
reach_max_valuations=4096

# Campaign adapter. run_engine.sh owns the stage order; this experiment
# supplies only the workload half. replay.sh is pass.sh's counterpart for a
# concolic replay: the tracing pass and the replay run different artifacts on
# different JVMs and are never interchangeable.
concolic_replay_command=experiments/hdfs/hdfs-11741/replay.sh
# Independent obligations replay in parallel, each in its own fresh cluster.
# Eight is this handoff's configured pool, not a property of the model.
concolic_worker_count=8
campaign_max_iterations=8
# Failure-directed path discovery is bounded independently of CFG loops.  The
# former limit of sixteen stopped three selected producers with published
# obligations still pending.  Keep eight-way replay, but let the worklist
# close more of the failure-directed prefix before reporting a real bound gap.
producer_max_paths_per_region=64
producer_max_flips_per_path=16
producer_max_path_tasks=64
