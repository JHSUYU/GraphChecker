# HDFS-11741 workflow rooted at the pre-fix Hadoop checkout.
workflow_path_base=project

# GraphChecker toolchain.
graphchecker_jar=target/GraphChecker-1.0-SNAPSHOT-jar-with-dependencies.jar
graphchecker_pom=pom.xml
graphchecker_work_dir=.
java_bin=java
maven_bin=mvn
build_maven_args=package -DskipTests

# Hadoop HDFS main and JUnit classes. run.sh supplies the generated full
# test-scope classpath through CAUSYNTH_CLASSPATH.
project_repo=/opt/hadoop
project_module_dir=@repo/hadoop-hdfs-project/hadoop-hdfs
project_classes_dir=@repo/hadoop-hdfs-project/hadoop-hdfs/target/classes
project_test_classes_dir=@repo/hadoop-hdfs-project/hadoop-hdfs/target/test-classes
project_classpath=@repo/hadoop-hdfs-project/hadoop-hdfs/target/classes:@repo/hadoop-hdfs-project/hadoop-hdfs/target/test-classes:@repo/hadoop-hdfs-project/hadoop-hdfs-client/target/classes
analysis_classes_dir=experiments-output/hdfs-11741/instrumented-classes

# Static analysis target and outputs.
causynth_output_dir=experiments-output/hdfs-11741/analysis
causynth_target_spec=experiments/hdfs/hdfs-11741/target.yaml
causynth_analysis_scope=hdfs-11741
causynth_process_dirs=@repo/hadoop-hdfs-project/hadoop-hdfs/target/classes:@repo/hadoop-hdfs-project/hadoop-hdfs/target/test-classes:@repo/hadoop-hdfs-project/hadoop-hdfs-client/target/classes:@repo/hadoop-common-project/hadoop-common/target/classes
causynth_protocol_stubs=experiments/hdfs/hdfs-11741/protocol-stubs.jsonl

# Runtime dependencies. The workload runs one JUnit method with instrumented
# classes first on the classpath; concolic replay is a separate later stage.
custom_jdk_home=third_party/OpenJDK-Concolic-Execution-Engine/build/linux-x86_64-normal-zero-release/images/j2sdk-image
z3_bin=z3
workload_work_dir=@project/.
workload_command=experiments/hdfs/hdfs-11741/run.sh traced-workload
trace_test=TestBalancerWithEncryptedTransfer.testEncryptedBalancer1

# Runtime and scheduled artifacts.
runtime_region_plan=experiments-output/hdfs-11741/runtime/concolic_region_plan.jsonl
runtime_edge_validations=experiments-output/hdfs-11741/runtime/runtime_region_edge_validation.jsonl
schedule_output_dir=experiments-output/hdfs-11741/schedule
solver_timeout_ms=20000
