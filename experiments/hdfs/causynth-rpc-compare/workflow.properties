# The RPC header-propagation fixture's inputs to the run_engine.sh campaign.
#
# This fixture is the small counterpart of hdfs-11741: two DataNodes publish a
# value the NameNode reads once and compares, so one symbolic value crosses two
# real Hadoop RPC boundaries and nothing else has to be true for the campaign
# to exercise the handoff. run-z3.sh drives one scenario and run-matrix.sh
# drives all twenty; both override the generated-output paths below through
# CAUSYNTH_* so each row owns a private root.
#
# Every generated-output path derives from causynth_output_dir (run_engine.sh's
# initialize_config): the instrumented classes, the runtime region plan and the
# campaign root. Naming one root is the whole configuration, and the campaign
# root is <causynth_output_dir>/schedule. Do not re-add analysis_classes_dir,
# runtime_region_plan or schedule_output_dir -- three roots that must agree are
# three ways to half-resume a published run.

workflow_path_base=project

graphchecker_jar=target/GraphChecker-1.0-SNAPSHOT-jar-with-dependencies.jar
graphchecker_work_dir=.
java_bin=java

# CAUSYNTH_REPO overrides this, and run-matrix.sh always does: each row gets a
# git worktree of its own because the scenario is a compile-time constant.
# /opt/hadoop is a stale checkout with none of the Causynth commits.
project_repo=/users/ZhenyuLi/dev/hadoop
project_module_dir=@repo/hadoop-hdfs-project/hadoop-hdfs
project_classes_dir=@repo/hadoop-hdfs-project/hadoop-hdfs/target/classes
project_test_classes_dir=@repo/hadoop-hdfs-project/hadoop-hdfs/target/test-classes

# One fresh generation root. campaign-run33 and everything beside it under
# gc-rpc-compare are published runs; the engine refuses to overwrite one, and
# resuming one is what this line exists to prevent. run-z3.sh replaces it with
# a private mktemp root per run, so this value is the standalone default.
causynth_output_dir=/proj/silentfailure-PG0/gc-rpc-compare/campaign-takeover-01
causynth_target_spec=@config/target.yaml
causynth_analysis_scope=causynth-rpc-compare
causynth_process_dirs=@repo/hadoop-hdfs-project/hadoop-hdfs/target/classes:@repo/hadoop-hdfs-project/hadoop-hdfs-client/target/classes:@repo/hadoop-common-project/hadoop-common/target/classes
causynth_protocol_stubs=experiments/hdfs/causynth-rpc-compare/protocol-stubs.jsonl
# README section "Loops": the declarations file is required, not optional, so
# that a campaign cannot lose its per-loop K_L in silence. This fixture retains
# no condition-controlled loop and its file therefore declares no row -- see
# the file itself, which states that rather than leaving it to be inferred from
# an absent key.
causynth_loop_bounds=experiments/hdfs/causynth-rpc-compare/loop-bounds.jsonl
custom_jdk_home=third_party/OpenJDK-Concolic-Execution-Engine/build/linux-x86_64-normal-zero-release/images/j2sdk-image
z3_bin=z3
workload_work_dir=@project/.
# The launcher's build output is not a path-resolved key: it is embedded in a
# command string, so it names the same root as causynth_output_dir by hand.
# HADOOP_HOME_DIR is left to source-first-launcher.sh, which defaults to the
# checkout beside this one; run-z3.sh passes the leased worktree instead.
campaign_setup_command=HADOOP_PROTOC_PATH=/opt/causynth-toolchain/protoc-2.5.0/bin/protoc LAUNCHER_OUTPUT=/proj/silentfailure-PG0/gc-rpc-compare/campaign-takeover-01/launcher-build experiments/hdfs/causynth-rpc-compare/source-first-launcher.sh build
workload_command=RPC_COMPARE_OUTPUT=/proj/silentfailure-PG0/gc-rpc-compare/campaign-takeover-01/launcher-build experiments/hdfs/causynth-rpc-compare/pass.sh
trace_test=org.apache.hadoop.hdfs.TestCausynthRpcHeaderPropagation#nameNodeComparesValuesReadOnceFromTwoDataNodes

schedule_max_jobs=8
solver_timeout_ms=120000
reach_max_inputs=4
reach_max_valuations=64

concolic_replay_command=RPC_COMPARE_BUILD_OUTPUT=/proj/silentfailure-PG0/gc-rpc-compare/campaign-takeover-01/launcher-build experiments/hdfs/causynth-rpc-compare/replay.sh
concolic_worker_count=8
campaign_max_iterations=3
# This fixture has no loops and only the finite branch sites in the two RPC
# producer helpers.  Keep the eight-worker pool, but leave enough obligation
# budget to close every feasible branch-prefix class instead of stopping after
# the first eight cases.
producer_max_paths_per_region=256
producer_max_flips_per_path=64
producer_max_path_tasks=512
