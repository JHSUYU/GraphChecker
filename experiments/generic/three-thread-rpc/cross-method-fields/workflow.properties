workflow_path_base=project

fixture_class=edu.uva.liftlab.graphchecker.fixtures.CrossMethodExternalFieldThreeThreadWorkload
trace_test=CrossMethodExternalFieldThreeThreadWorkload
custom_jdk_docker_image=causynth-openjdk8-build:ubuntu18

graphchecker_jar=target/GraphChecker-1.0-SNAPSHOT-jar-with-dependencies.jar
graphchecker_pom=pom.xml
graphchecker_work_dir=.
java_bin=java
maven_bin=mvn
build_maven_args=package -DskipTests

project_repo=.
project_module_dir=.
project_classes_dir=target/three-thread-rpc-cross-method-fields/original-classes
project_test_classes_dir=target/test-classes
project_classpath=target/three-thread-rpc-cross-method-fields/original-classes:target/classes
analysis_classes_dir=target/three-thread-rpc-cross-method-fields/instrumented-classes
causynth_output_dir=target/three-thread-rpc-cross-method-fields/analysis
causynth_target_spec=experiments/generic/three-thread-rpc/cross-method-fields/target.yaml
causynth_analysis_scope=three_thread_rpc_cross_method_fields
causynth_process_dirs=target/three-thread-rpc-cross-method-fields/original-classes

custom_jdk_home=third_party/OpenJDK-Concolic-Execution-Engine/build/linux-x86_64-normal-zero-release/images/j2sdk-image
z3_bin=z3
solver_timeout_ms=20000
# Producer A has two null short-circuit paths plus a finite Cartesian product
# of three bounded integer categories, two Boolean values, and two String
# contains outcomes: 2 + (3^3 * 2 * 2) = 110 output-relevant paths.  Keep the
# campaign explicitly bounded while leaving enough room to prove closure.
producer_max_paths_per_region=128
workload_work_dir=.
workload_command=java -Dcausynth.trace.output.dir=target/three-thread-rpc-cross-method-fields/runtime -Dcausynth.static.graph=target/three-thread-rpc-cross-method-fields/analysis/static_dataflow_edges.jsonl -Dcausynth.symbolic.regions=target/three-thread-rpc-cross-method-fields/analysis/symbolic_regions.jsonl -Dcausynth.symbolic.region.edges=target/three-thread-rpc-cross-method-fields/analysis/symbolic_region_edges.jsonl -Dcausynth.trace.test=CrossMethodExternalFieldThreeThreadWorkload -Dcausynth.trace.streaming.only=false -Dcausynth.trace.aggregate.on.shutdown=true -cp target/three-thread-rpc-cross-method-fields/instrumented-classes:target/GraphChecker-1.0-SNAPSHOT-jar-with-dependencies.jar edu.uva.liftlab.graphchecker.fixtures.CrossMethodExternalFieldThreeThreadWorkload false false

static_regions=target/three-thread-rpc-cross-method-fields/analysis/symbolic_regions.jsonl
static_graph=target/three-thread-rpc-cross-method-fields/analysis/static_dataflow_edges.jsonl
runtime_activation_plan=target/three-thread-rpc-cross-method-fields/runtime/concolic_activation_plan.jsonl
runtime_edge_validations=target/three-thread-rpc-cross-method-fields/runtime/runtime_region_edge_validation.jsonl
