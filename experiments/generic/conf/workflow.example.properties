# Generic GraphChecker/concolic workflow example.
# Relative paths use the GraphChecker checkout because path_base=project.
# Use @config/, @project/ (or @graphchecker/), and @repo/ for an explicit base.
workflow_path_base=project

# Toolchain. All of these can be overridden by environment variables.
graphchecker_jar=target/GraphChecker-1.0-SNAPSHOT-jar-with-dependencies.jar
graphchecker_pom=pom.xml
graphchecker_work_dir=.
java_bin=java
maven_bin=mvn
build_maven_args=clean package -DskipTests

# Analyzed project and Soot inputs.
project_repo=.
project_module_dir=@repo/.
project_classes_dir=@repo/target/classes
project_test_classes_dir=@repo/target/test-classes
project_classpath=@repo/target/classes:@repo/target/test-classes
analysis_classes_dir=target/generic-workflow/instrumented-classes

# Static analysis output and target.
causynth_output_dir=target/generic-workflow/analysis
causynth_target_spec=experiments/generic/conf/target.example.yaml
causynth_analysis_scope=generic_fixture
causynth_process_dirs=@repo/target/classes:@repo/target/test-classes

# Runtime/tool dependencies. The custom JDK path may point at an unbuilt image
# while validating the config; workload/replay setup must build it before use.
custom_jdk_home=third_party/OpenJDK-Concolic-Execution-Engine/build/linux-x86_64-normal-zero-release/images/j2sdk-image
z3_bin=z3
solver_timeout_ms=20000
reach_max_inputs=12
reach_max_valuations=4096

# Workload command is executed only by the explicit `workload` command.
workload_work_dir=@repo/.
workload_command=mvn -q test
trace_test=generic-workload

# Runtime inputs normally produced by an instrumented workload execution.
runtime_region_plan=target/generic-workflow/runtime/concolic_region_plan.jsonl

# Scheduled task output.
schedule_output_dir=target/generic-workflow/schedule

# Optional multi-file inputs are colon-separated. Override this when composing
# several producer relations plus a target summary.
compose_summary_inputs=target/generic-workflow/schedule/merged_region_summaries.jsonl
fatal_region=

# `reach` writes the exact finite Boolean projection of the composed bug path.
# The composed SMT, composition manifest, static regions, and relationship
# candidates use their standard schedule-directory defaults.
reach_report=target/generic-workflow/schedule/boolean_reach_condition.json
