workflow_path_base=project

graphchecker_jar=target/GraphChecker-1.0-SNAPSHOT-jar-with-dependencies.jar
java_bin=experiments/solr/solr-18406/java.sh
graphchecker_work_dir=.

project_repo=/opt/solr
project_module_dir=@repo/solr/core
project_classes_dir=/tmp/solr18406-analysis-classes
project_test_classes_dir=@repo/solr/build/solr-core/classes/test

causynth_output_dir=/tmp/graphchecker-solr-18406
causynth_cache_dir=/tmp/graphchecker-solr-18406-cache
causynth_target_spec=@config/target.yaml
causynth_analysis_scope=solr-18406
causynth_communication_mappings=@config/communication-mappings.jsonl
causynth_loop_bounds=@config/loop-bounds.jsonl
causynth_symbolic_root_proposal=@config/symbolic-root-proposal.json

custom_jdk_home=third_party/OpenJDK-Concolic-Execution-Engine/build/linux-x86_64-normal-zero-release/images/j2sdk-image
z3_bin=/usr/local/bin/z3
workload_work_dir=@repo/.
workload_command=/opt/GraphChecker/experiments/solr/solr-18406/pass.sh
trace_test=org.apache.solr.handler.TestReplicationHandler#testFollowerRestartsWhenCommitExpiresBeforeFileDownload
concolic_replay_command=/opt/GraphChecker/experiments/solr/solr-18406/replay.sh
campaign_setup_command=/opt/GraphChecker/experiments/solr/solr-18406/prepare-analysis.sh

schedule_max_jobs=32
