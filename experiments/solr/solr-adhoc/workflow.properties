java_bin=experiments/lib/java.sh
graphchecker_work_dir=.

causynth_target_spec=@config/target.yaml
causynth_root_domains=@config/root-domains.jsonl
causynth_loop_default_bound=8

custom_jdk_home=third_party/OpenJDK-Concolic-Execution-Engine/build/linux-x86_64-normal-zero-release/images/j2sdk-image
z3_bin=/u/vnr3ne/.local/bin/z3

schedule_max_jobs=1024
solver_timeout_ms=1800000
compose_max_valuations=128
# A Solr replay JVM holds a two-node SolrCloud with its ZooKeeper; measured
# on the first rounds and raised when a round shows more.
# Measured (accept-a40-20/21, a40h): ad-hoc replays peak at 0.3-1.8 GB; a
# replay that grows past its charge takes more where the host's real memory
# has room (run_engine.sh campaign_watch_workload).
obligation_memory_mb=2500
# A sweep case explores within a budget of waves (every case ends at its
# first accepted witness, PIPELINE §7.9).
region_path_max_waves=4
engine_memory_mb=16384
