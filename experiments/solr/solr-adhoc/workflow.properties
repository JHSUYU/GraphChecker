workflow_path_base=project

graphchecker_jar=target/GraphChecker-1.0-SNAPSHOT-jar-with-dependencies.jar
java_bin=experiments/lib/java.sh
graphchecker_work_dir=.

causynth_loop_default_bound=8

custom_jdk_home=third_party/OpenJDK-Concolic-Execution-Engine/build/linux-x86_64-normal-zero-release/images/j2sdk-image

schedule_max_jobs=1024
solver_timeout_ms=1800000
compose_max_valuations=128

# A check's target occurrence is the first the recording observes, so the
# scope grows from the declared classes to what the slice needs.
# The engine heap a planner or composer may grow to: a head step, one JVM
# alone on its host, under the head steps' ceiling (run_engine.sh
# campaign_head_max_used_pct, 88 %: 27793 MB of a 31583 MB lift) beside the
# 1.0-1.6 GB a lift has in use -- its footprint (campaign_jvm_footprint_mb)
# 26496 MB, the composer's z3 room the rest.  Owner 2026-10-17: give the
# single-JVM steps what the host holds.  Solvers stay at 16384 MB
# (campaign_solver_max_heap_mb), under the replays' 70 %.  At 16384 the
# planners of 10, 14 and 40 ran out of heap over 16-22 GB corpora, and 14's
# composer held 6 of its 353 paths.
engine_memory_mb=24576
# A seed replay may take 130 times its recording (seed_replay_time_factor;
# the engine's default is 40, and the bound is never under replay_timeout_s):
# Solr's recordings run 12-37 s, so a seed gets up to ~4800 s while every
# focused replay keeps replay_timeout_s=2400 -- solr-adhoc-40's seed took
# 2169 s of its 2400 s bound (Z1T1), solr-adhoc-13's ran past it (IB1), and the
# final round runs all twenty at once (lead 2026-10-12; STATUS "Per-system
# surface").
seed_replay_time_factor=130
