schedule_max_jobs=128
solver_timeout_ms=1800000
compose_max_valuations=128
# 2026-09-21: re-declared from REGION.f0132fca (serializeSnapshotSection's own
# region) to REGION.5cf88831, the checkpoint RPC handler on the restarted
# NameNode that ENCLOSES it.  A declared region entered synchronously inside a
# running occurrence opens none of its own -- its sites are events of the
# enclosing occurrence -- so the old selector named a region that no longer
# opens anything and PLAN refused with DECLARED_TARGET_OCCURRENCE_UNOBSERVED
# ("names 0 of the 2 observed target occurrence(s)").  Both target entries
# carry regionFolded=1 and fold up through saveSnapshots, saveInternal, save
# and saveFSImage into REGION.5cf88831.  The target SITE -- the snapshot-count
# check inside serializeSnapshotSection -- is unchanged.
# One obligation (solver JVM + replay JVM) on these light corpora measured
# ~0.75 GB RSS per worker in v21; 2500 MB leaves room for the corpus to grow.
obligation_memory_mb=2500

# Owner ruling 2026-09-14: clocks are flipped by brute force; no window.
# The declared target occurrence names a region of the scope as declared;
# growing the scope turns more of it into region roots, and an occurrence
# whose region now encloses the target renames it (v60: 8 of 9 cases
# DECLARED_TARGET_OCCURRENCE_UNOBSERVED).  Declared before growth, kept so.
causynth_scope_growth_budget=0
