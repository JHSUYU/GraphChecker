# region) to REGION.5cf88831, the checkpoint RPC handler on the restarted
# NameNode that ENCLOSES it.  A declared region entered synchronously inside a
# running occurrence opens none of its own -- its sites are events of the
# enclosing occurrence -- so the old selector named a region that no longer
# opens anything and PLAN refused with DECLARED_TARGET_OCCURRENCE_UNOBSERVED
# ("names 0 of the 2 observed target occurrence(s)").  Both target entries
# carry regionFolded=1 and fold up through saveSnapshots, saveInternal, save
# and saveFSImage into REGION.5cf88831.  The target SITE -- the snapshot-count
# check inside serializeSnapshotSection -- is unchanged.
