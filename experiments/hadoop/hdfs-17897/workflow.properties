z3_bin=/u/vnr3ne/.local/bin/z3

# The DataNode compares its registration-time copy of K1 against its own
# clock, and the copies the recorded RPC refresh installed need +653 s and
# +658 s of skew to expire.  Owner ruling 2026-09-14: a wall clock carries no physics this
# checker can appeal to -- a bound on two nodes' difference is a number
# somebody picked -- so no window is asserted at all.  What the execution
# fixes is stated where it belongs: the order a node's own readings came in,
# and the value each path read.

schedule_max_jobs=128
solver_timeout_ms=1800000
compose_max_valuations=128

# Which occurrence of the annotated site this case is about, as a full
# occurrence address.  The owner assumes the failing instance is known; a
# recording is the healthy path by nature, so no occurrence is distinguished
# and the case names the first observed one (rule: first observed, full
# address).  lane17897g observed two, #1 and #2.
# 2026-09-21: re-declared from REGION.53092d3e (retrieveDataEncryptionKey's
# own region) to REGION.7c569c3f, the SaslDataTransferServer callback handler
# that ENCLOSES it.  A declared region entered synchronously inside a running
# occurrence opens none of its own, so the old address named a region that
# opens nothing and PLAN refused with DECLARED_TARGET_OCCURRENCE_UNOBSERVED.
# The seed recording confirms the fold: every entry of 53092d3e sits under an
# occurrence of 7c569c3f on the right node and request.  Same ruling and same
# fix as hdfs-11741 and hdfs-17960.  The target SITE is unchanged.
# dn1's SASL callback handler, under the block-group checksum LEADER's own
# relay request.  It used to name dn0 under the client's request, and dn0 is
# the one node that cannot work: the client asks dn0 for the block-group
# checksum, and dn0 as leader then reads EVERY internal block through
# connectToDN INCLUDING ITS OWN, so dn0 serves two handshakes at one code
# point and a focused replay that flips a root reproduces only one of them --
# six BLOCKING REPLAY TOPOLOGY_DIVERGENCE rows, measured three times, and not
# fixable by file size or cell size (both tried).  dn1 serves exactly one.
# The mechanism is unchanged: a party presents a key the peer cannot resolve.
# The declared target occurrence names a region of the scope as declared;
# growing the scope turns more of it into region roots, and an occurrence
# whose region now encloses the target renames it (v60: 8 of 9 cases
# DECLARED_TARGET_OCCURRENCE_UNOBSERVED).  Declared before growth, kept so.
causynth_scope_growth_budget=0
