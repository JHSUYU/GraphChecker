workflow_path_base=project

graphchecker_jar=target/GraphChecker-1.0-SNAPSHOT-jar-with-dependencies.jar
java_bin=experiments/hadoop/hdfs-17897/java.sh
graphchecker_work_dir=.

project_repo=/opt/hadoop-hdfs-17897
project_module_dir=@repo/hadoop-hdfs-project/hadoop-hdfs
project_classes_dir=/tmp/graphchecker-hdfs-17897-classes
project_test_classes_dir=@repo/hadoop-hdfs-project/hadoop-hdfs/target/test-classes

causynth_output_dir=/tmp/graphchecker-hdfs-17897
causynth_cache_dir=/tmp/graphchecker-hdfs-17897-cache
causynth_target_spec=@config/target.yaml
causynth_communication_mappings=@config/communication-mappings.jsonl
causynth_symbolic_inputs=@config/symbolic-inputs.jsonl
causynth_loop_bounds=@config/loop-bounds.jsonl

custom_jdk_home=third_party/OpenJDK-Concolic-Execution-Engine/build/linux-x86_64-normal-zero-release/images/j2sdk-image
z3_bin=/usr/local/bin/z3
workload_work_dir=@repo/.
trace_test=org.apache.hadoop.hdfs.TestCausynthStripedChecksum#testStaleEncryptionKeyFailsStripedChecksum

# The DataNode compares its registration-time copy of K1 against its own
# clock, and the copies the recorded RPC refresh installed need +653 s and
# +658 s of skew to expire.  The default +/-300 s window admits neither, so
# every case but the pre-recording one is decided before the solver sees it.
clock_skew_ms=900000

schedule_max_jobs=128
solver_timeout_ms=1800000
reach_max_inputs=8
reach_max_valuations=128
concolic_worker_count=8
campaign_max_iterations=3

# Which occurrence of the annotated site this case is about, as a full
# occurrence address.  The owner assumes the failing instance is known; a
# recording is the healthy path by nature, so no occurrence is distinguished
# and the case names the first observed one (rule: first observed, full
# address).  lane17897g observed two, #1 and #2.
declared_target_occurrence=hdfs-17897/dn0#epoch0/region/REGION.53092d3e-263d-3a18-b7a5-ae5b437d96de@hdfs-17897/client#epoch0/striped-file-checksum#1
