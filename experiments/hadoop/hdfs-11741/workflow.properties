workflow_path_base=project

graphchecker_jar=target/GraphChecker-1.0-SNAPSHOT-jar-with-dependencies.jar
java_bin=experiments/lib/java.sh
graphchecker_work_dir=.


causynth_target_spec=@config/target.yaml
causynth_communication_mappings=@config/../communication-mappings.jsonl
causynth_root_domains=@config/root-domains.jsonl
causynth_loop_default_bound=8

custom_jdk_home=third_party/OpenJDK-Concolic-Execution-Engine/build/linux-x86_64-normal-zero-release/images/j2sdk-image

# PLAN task cap (--max-jobs): the number of planned OCCURRENCES in the
# seed plan, not replays.  Raised from 128 when region retention became
# a scope fact: the static scope map names the REGIONS whose text stores
# a location, never which activation of one wrote it, so a declared
# writer or attach frame contributes every activation the recording
# entered it in -- 133 for this case, where the recorded receiver
# pairing used to choose 5 of 15.
schedule_max_jobs=256
solver_timeout_ms=1800000
compose_max_valuations=128
# The head's planner and composer hold the whole corpus: 202 sessions by
# wave 4 of v77 (vs 74 in v58) ran the planner out of 8 GB.  lift06 heads
# this case alone.
engine_memory_mb=16384

# Which occurrence of the annotated site this case is about, as a full
# occurrence address.  The owner assumes the failing instance is known; a
# recording is the healthy path by nature, so no occurrence is distinguished
# and the case names the first observed one (rule: first observed, full
# address).  The family and k alone would name two here: dn0 and dn1 both
# answer balance-block#1.  lane11741h composed all four: 76 minutes.
# 2026-09-21: the named region is the SASL handler (7c569c3f), not
# retrieveDataEncryptionKey (53092d3e).  A declared region entered inside a
# running occurrence opens none of its own, and every entry of 53092d3e on
# this recording is nested in an occurrence of the handler (through the
# folded a97eb98d and b6ee6616), so 53092d3e names no occurrence at all; the
# handler occurrence is the one that owns the target site, which is what the
# paper calls "the DataNode SASL computation that reaches the target lookup".
# The target SITE -- the allKeys.get(keyId) == null decision inside
# retrieveDataEncryptionKey -- is unchanged.

# Owner ruling 2026-09-14: clocks are flipped by brute force; no physical
# meaning is attached to the skew, so the window is 30 days (2592000000 ms)
# and any clock movement the fatal needs is admissible.

# EXPLORE closure size cap (--max-tasks): the dn1 target closure is 78 occurrences after X12
region_path_max_tasks=128
# The declared target occurrence names a region of the scope as declared;
# growing the scope turns more of it into region roots, and an occurrence
# whose region now encloses the target renames it (v60: 8 of 9 cases
# DECLARED_TARGET_OCCURRENCE_UNOBSERVED).  Declared before growth, kept so.
causynth_scope_growth_budget=0
