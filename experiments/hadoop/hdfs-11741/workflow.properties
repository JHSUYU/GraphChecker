# address, or the request family and k.  lane11741h observed four --
# hdfs-11741/balancer#epoch0/balance-block#1 and #2, on dn0 and on dn1 -- and
# spent 76 minutes composing and solving all four; its recording took the
# healthy arm at every one, so naming the one that can fail is what narrows
# the run.
#declared_target_occurrence=hdfs-11741/balancer#epoch0/balance-block#1
